name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [check, test, 'test:integration']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare integration database image
        if: matrix.command == 'test:integration'
        run: docker pull pgvector/pgvector:0.8.7-pg15-trixie
      - run: npm run ${{ matrix.command }}
